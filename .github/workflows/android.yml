name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  build:
    name: Build Cordova Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'mobile-cordova/package.json'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Add Android Platform and Build APK
        run: |
          cd mobile-cordova
          echo "=== Diagnostic Info ==="
          node -v
          npm -v
          echo "=== Installing NPM dependencies ==="
          npm install
          echo "=== Adding Android Platform ==="
          cordova platform add android --verbose
          echo "=== Building Android APK ==="
          cordova build android --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardRobot-Debug-APK
          path: mobile-cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk
